<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈夫克集团"官网"</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #040818;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        /* 星空粒子动画层 */
        .star-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 8s infinite ease-in-out;
        }
        /* 星星闪烁漂浮动画 */
        @keyframes twinkle {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translateY(-30px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(0.4);
            }
        }
        /* 顶部导航栏 */
        header {
            width: 100%;
            background: linear-gradient(90deg, #0a1436, #0c2052, #0a1436);
            display: flex;
            align-items: center;
            padding: 14px 60px;
            gap: 60px;
            box-shadow: 0 2px 12px #00082280;
        }
        .nav-logo img {
            height: 70px;
        }
        .nav-menu {
            display: flex;
            gap: 55px;
            flex: 1;
        }
        .nav-menu a {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            padding: 8px 4px;
            position: relative;
            transition: color 0.3s;
        }
        .nav-menu a:hover {
            color: #66ccff;
        }
        .nav-menu a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 3px;
            background: #44aaff;
            transition: width 0.3s;
        }
        .nav-menu a:hover::after {
            width: 100%;
        }
        /* 主体内容区域 */
        main {
            padding: 80px 30px;
            text-align: center;
        }
        .page-title {
            font-size: 64px;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 60px;
            letter-spacing: 6px;
        }
        /* 三张图片并排容器 修复布局 */
        .img-card-wrap {
            display: flex;
            justify-content: center;
            gap: 32px;
            max-width: 1400px;
            margin: 0 auto;
            /* 移动端自动换行 */
            flex-wrap: wrap;
        }
        .img-card {
            width: calc((100% - 64px) / 3);
            min-width: 280px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 25px #3388ff40;
        }
        .img-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            /* 移除错误的 content:url() 写法 */
        }
        /* 手机适配 */
        @media (max-width:992px) {
            .img-card {
                width: 45%;
            }
        }
        @media (max-width:600px) {
            .img-card {
                width: 100%;
            }
            header {
                flex-direction: column;
                gap:20px;
                padding:15px;
            }
            .nav-menu {
                flex-wrap: wrap;
                justify-content:center;
                gap:20px;
            }
            .page-title {
                font-size:40px;
            }
        }
    </style>
</head>
<body>
    <!-- 星空背景粒子自动生成 -->
    <div class="star-bg" id="starBox"></div>

    <!-- 顶部导航栏 -->
    <header>
        <div class="nav-logo">
            <img src="a.png" alt="哈夫克集团logo">
        </div>
        <div class="nav-menu">
            <a href="index.html">首页</a>
            <a href="about.html">关于我们</a>
            <a href="project.html">最新项目</a>
            <a href="news.html">热点新闻</a>
            <a href="https://old-six-x.github.io/HAAVKplatformG/" target="_blank">网站导览</a>
        </div>
    </header>

    <!-- 页面主体 -->
    <main>
        <h1 class="page-title">哈夫克集团</h1>
        <!-- 三张并排圆角图片 -->
        <div class="img-card-wrap">
            <div class="img-card">
                <img src="chatu1l.png" alt="展示图1">
            </div>
            <div class="img-card">
                <img src="chatu2.png" alt="展示图2">
            </div>
            <div class="img-card">
                <img src="img3.png" alt="展示图3">
            </div>
        </div>
    </main>

    <!-- JS生成随机星星 -->
    <script>
        const starBox = document.getElementById("starBox");
        for(let i = 0; i < 200; i++){
            const star = document.createElement("div");
            star.className = "star";
            let size = Math.random() * 3 + 1;
            star.style.width = size + "px";
            star.style.height = size + "px";
            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";
            star.style.animationDelay = Math.random() * 8 + "s";
            starBox.appendChild(star);
        }
    </script>
</body>
</html>
